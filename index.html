<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LC CASA &amp; Restaurant</title>
  <meta name="description" content="LC CASA &amp; Restaurant — Instagram, TikTok, Drinks Menu, Food Menu">

  <!-- ============================================================
       الخطوط (Google Fonts)
       يمكنك تغيير الخط من هنا بسهولة إذا أردت خطًا مختلفًا
  ============================================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <div class="card">

      <!-- ============================================================
           1) اللوجو
           غيّر مسار الصورة هنا فقط. الأفضل استخدام ملف PNG شفاف الخلفية
           بحجم مربع تقريبًا (مثال: logo.png) وضعه في نفس مجلد الموقع.
      ============================================================= -->
      <img class="logo" src="logo.png" alt="LC  Cafe & Restaurant Logo" width="140" height="140">

      <!-- ============================================================
           2) اسم المكان
      ============================================================= -->
      <h1 class="brand-name">LA CASA</h1>

      <!-- فاصل زخرفي بسيط -->
      <div class="divider" aria-hidden="true">
        <span class="divider-line"></span>
        <span class="divider-dot"></span>
        <span class="divider-line"></span>
      </div>

      <!-- ============================================================
           3) الوصف / الجملة القصيرة
      ============================================================= -->
      <p class="tagline">Café &amp; Restaurant</p>

      <!-- ============================================================
           4) الروابط — غيّر الروابط التالية فقط (سطر href="...")
      ============================================================= -->
      <nav class="links" aria-label="روابط المقهى">

        <!-- رابط Instagram -->
        <a class="btn" href="https://www.instagram.com/lc_lacasacaffe?igsh=aDRvYzU1aW4zdGtq&utm_source=qr"

            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none"></circle>
          </svg>
          <span>Instagram</span>
        </a>

        <!-- رابط TikTok -->
        <a class="btn" href="https://www.tiktok.com/@lc_lacasacaffe?_r=1&_t=ZS-98pb1swwgEu" target="_blank"

          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M13 3v10.8a3.2 3.2 0 1 1-2.4-3.1"></path>
            <path d="M13 3c.4 2.2 2.1 3.8 4.3 4"></path>
          </svg>
          <span>TikTok</span>
        </a>

        <!-- رابط قائمة المشروبات -->
        <a class="btn" href="drinks-menu.pdf (1)" target="_blank" rel="noopener noreferrer">

            <path d="M9 21h6"></path>
            <path d="M12 18v3"></path>
          </svg>
          <span>Drinks Menu</span>
        </a>

        <a class="btn" href="food-menu.pdf-compressed" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">

            <path d="M10 3v4"></path>

      <footer class="footer">
        <span>LC Café &amp; Restaurant</span>
